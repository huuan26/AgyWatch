<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#374151" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="220" rx="10" fill="url(#bgGrad)" />
  <rect width="920" height="220" rx="10" fill="url(#pixelGrid)" />
  <rect x="0.5" y="0.5" width="919" height="219" rx="9.5" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Left: Watchdog Pixel Radar Icon -->
  <g transform="translate(48, 38)">
    <circle cx="72" cy="72" r="66" fill="#111827" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="72" cy="72" r="44" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
    <circle cx="72" cy="72" r="22" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <circle cx="72" cy="72" r="6" fill="#10b981" />
    <!-- Radar sweep line -->
    <line x1="72" y1="72" x2="128" y2="32" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <!-- Blip pulse -->
    <circle cx="116" cy="40" r="4" fill="#34d399" />
    <circle cx="48" cy="98" r="3" fill="#fbbf24" />
  </g>

  <!-- Center Text -->
  <g transform="translate(230, 48)">
    <!-- Title -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="url(#emeraldGrad)">AGYWATCH</text>
    
    <!-- Subtitle -->
    <text x="2" y="86" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="14.5" font-weight="600" fill="#9ca3af" letter-spacing="0.5">
      AUTONOMOUS GIT &amp; CI WATCHDOG FOR GOOGLE ANTIGRAVITY
    </text>

    <!-- Badges / Tags -->
    <g transform="translate(2, 110)">
      <!-- Badge 1: Zero-Dep -->
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="52" y="16" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700">STDLIB ONLY</text>

      <!-- Badge 2: Async -->
      <rect x="115" y="0" width="125" height="24" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="177" y="16" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">ASYNC DAEMON</text>

      <!-- Badge 3: Dual-Mode -->
      <rect x="250" y="0" width="145" height="24" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="322" y="16" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">CO-BOT READY</text>
    </g>
  </g>
</svg>
